[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-stock-selector"
version = "1.0.0"
description = "Quantitative stock selection and dollar-cost-averaging backtesting against IVV"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["quantitative", "backtesting", "factor-investing", "dca", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    # lxml backs pandas.read_html, used to reconstruct S&P 500 membership.
    "lxml>=4.9",
    # Secondary market-data source; the architecture does not depend on it as
    # the sole source of truth (REQUIREMENTS 44).
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
# The web UI and JSON API; the CLI works without these.
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
quant-stock-selector = "quant.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:yfinance.*",
]
