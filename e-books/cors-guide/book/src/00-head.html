<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<title>The Ultimate Developer's Guide to CORS</title>
<style>
/* ==========================================================================
   Print-first design system. Each .page is a fixed Letter-sized box so that
   page breaks, footers and page numbers are exact rather than hopeful.
   ========================================================================== */
@page { size: Letter; margin: 0; }

:root{
  --ink:#14181f; --muted:#59617a; --faint:#8d95ab;
  --accent:#2f4fd0; --accent-soft:#eaeeff;
  --good:#0d7a52; --good-soft:#e6f6ee;
  --warn:#a8620a; --warn-soft:#fdf1e0;
  --bad:#c0203f;  --bad-soft:#fdeaee;
  --panel:#f5f7fc; --panel-2:#eceff8; --line:#dbe1ef; --line-strong:#b9c2da;
  --code-bg:#161b28; --code-ink:#e9edf7;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --mono:"SF Mono","Menlo","Consolas",monospace;
}

*{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
html,body{ margin:0; padding:0; background:#fff; }
body{ font-family:var(--sans); color:var(--ink); font-size:10.4pt; line-height:1.55; }

.page{
  position:relative;
  width:8.5in; height:11in;
  padding:0.69in 0.78in 0.55in;
  page-break-after:always; break-after:page;
  overflow:hidden;
}
.page:last-child{ page-break-after:auto; break-after:auto; }

/* running footer + page number */
.pfoot{
  position:absolute; left:0.78in; right:0.78in; bottom:0.25in;
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:7.6pt; color:var(--faint); letter-spacing:.04em;
  border-top:0.5pt solid var(--line); padding-top:4pt;
}
.pfoot .ch{ text-transform:uppercase; }
.pfoot .n{ font-family:var(--mono); font-weight:700; color:var(--muted); }

/* ---------------- typography ---------------- */
h1,h2,h3,h4{ margin:0; letter-spacing:-0.015em; }
.chnum{
  font-family:var(--mono); font-size:8.4pt; font-weight:700;
  color:var(--accent); letter-spacing:.16em; text-transform:uppercase;
  margin-bottom:5pt;
}
h1.title{ font-size:23pt; line-height:1.12; margin-bottom:6pt; }
h2{ font-size:13.6pt; margin:16pt 0 5pt; }
h2:first-of-type{ margin-top:0; }
h3{ font-size:10.6pt; margin:12pt 0 3pt; }
h4{ font-size:9.6pt; margin:9pt 0 2pt; }
p{ margin:0 0 7pt; }
.lede{ font-size:11.4pt; line-height:1.5; color:var(--muted); margin-bottom:11pt; }
.small{ font-size:9pt; }
.tiny{ font-size:8.2pt; line-height:1.45; }
.muted{ color:var(--muted); }
b,strong{ font-weight:700; }
code,.mono{ font-family:var(--mono); font-size:0.9em; }
p code,li code,td code,.icode{
  background:var(--panel-2); padding:0.5pt 3pt; border-radius:3px;
  font-size:8.9pt; color:#1d2433; white-space:nowrap;
}
a{ color:var(--accent); text-decoration:none; }

ul,ol{ margin:0 0 7pt; padding-left:15pt; }
li{ margin-bottom:3.5pt; }
ul.tight li,ol.tight li{ margin-bottom:1.5pt; }
ul.plain{ list-style:none; padding-left:0; }

/* ---------------- blocks ---------------- */
pre{
  background:var(--code-bg); color:var(--code-ink);
  padding:9pt 11pt; border-radius:5pt; margin:6pt 0;
  font-family:var(--mono); font-size:8.3pt; line-height:1.5;
  white-space:pre-wrap; word-break:break-word;
}
pre .c{ color:#8b9bc4; }       /* comment */
pre .k{ color:#ffcf70; }       /* key / keyword */
pre .s{ color:#7fdba8; }       /* string / value */
pre .r{ color:#ff9fb0; }       /* danger */

.panel{ background:var(--panel); border:0.5pt solid var(--line); border-radius:6pt; padding:9pt 11pt; margin:8pt 0; }
.panel.tight{ padding:7pt 9pt; }

.callout{ border-left:2.5pt solid var(--accent); background:var(--accent-soft); padding:7pt 10pt; border-radius:0 5pt 5pt 0; margin:8pt 0; font-size:9.4pt; }
.callout.good{ border-color:var(--good); background:var(--good-soft); }
.callout.warn{ border-color:var(--warn); background:var(--warn-soft); }
.callout.bad{ border-color:var(--bad); background:var(--bad-soft); }
.callout .lbl{ font-weight:700; }

.grid{ display:grid; gap:9pt; }
.g2{ grid-template-columns:1fr 1fr; }
.g3{ grid-template-columns:repeat(3,1fr); }
.g21{ grid-template-columns:1.35fr 1fr; }
.g12{ grid-template-columns:1fr 1.35fr; }

table{ width:100%; border-collapse:collapse; font-size:8.9pt; margin:7pt 0; }
th,td{ text-align:left; padding:4.5pt 6pt; border-bottom:0.5pt solid var(--line); vertical-align:top; }
th{ font-size:7.6pt; text-transform:uppercase; letter-spacing:.07em; color:var(--muted); border-bottom:1pt solid var(--line-strong); }
td.k{ font-family:var(--mono); font-size:8.2pt; white-space:nowrap; }
tr.hl td{ background:var(--accent-soft); }
table.dense th,table.dense td{ padding:2.6pt 6pt; }

.tag{ display:inline-block; font-size:7.4pt; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
      padding:1pt 5pt; border-radius:8pt; vertical-align:1pt; }
.tag.a{ background:var(--accent-soft); color:var(--accent); }
.tag.g{ background:var(--good-soft); color:var(--good); }
.tag.w{ background:var(--warn-soft); color:var(--warn); }
.tag.b{ background:var(--bad-soft); color:var(--bad); }
.tag.m{ background:var(--panel-2); color:var(--muted); }

svg{ display:block; max-width:100%; }
figure{ margin:9pt 0; }
figcaption{ font-size:8pt; color:var(--muted); margin-top:4pt; line-height:1.45; }
figcaption b{ color:var(--ink); }

/* ---------------- book cover ---------------- */
.bookcover{ padding:0; color:#f2f5ff; background:#0a0f1e; }
.bookcover .bg{
  position:absolute; inset:0;
  background:
    radial-gradient(1000px 640px at 50% 30%, rgba(91,140,255,.26), transparent 62%),
    radial-gradient(680px 500px at 84% 90%, rgba(160,107,255,.20), transparent 66%),
    linear-gradient(178deg,#0c1224 0%,#0a0f1e 48%,#06090f 100%);
}
.bookcover .grid{
  position:absolute; inset:0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.030) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.030) 1px, transparent 1px);
  background-size:36px 36px;
}
.bookcover .spine{ position:absolute; left:0; top:0; bottom:0; width:16px;
  background:linear-gradient(180deg,#5b8cff 0%,#a06bff 58%,#4ad3a6 100%); }
.bookcover .hair{ position:absolute; left:16px; top:0; bottom:0; width:1px; background:rgba(255,255,255,.10); }
.bookcover .inner{ position:relative; height:100%; display:flex; flex-direction:column;
  padding:0.78in 0.72in 0.56in 0.9in; }

.bookcover .imprint{ display:flex; align-items:center; gap:9pt;
  font-family:var(--mono); font-size:8.2pt; letter-spacing:.2em; text-transform:uppercase; color:#8fa2d4; }
.bookcover .kicker{ margin-top:26pt; font-family:var(--mono); font-size:9.6pt; font-weight:700;
  letter-spacing:.17em; text-transform:uppercase; color:#7ea6ff; }
.bookcover h1.bt{ margin:9pt 0 0; font-size:53pt; line-height:0.96; letter-spacing:-0.032em; font-weight:700; }
.bookcover h1.bt .amp{ color:#9db4ff; font-weight:400; }
.bookcover .trule{ width:1.55in; height:3.5pt; border-radius:2pt; margin:17pt 0 15pt;
  background:linear-gradient(90deg,#5b8cff,#a06bff); }
.bookcover .sub{ font-size:12.6pt; line-height:1.42; color:#b9c4e4; max-width:5.05in; font-weight:400; }
.bookcover .art{ margin:auto 0 0; padding:6pt 0 0; display:flex; justify-content:center; }
.bookcover .art svg{ width:4.24in; }
.bookcover .artcap{ text-align:center; font-family:var(--mono); font-size:7.4pt;
  letter-spacing:.13em; text-transform:uppercase; color:#7f8db8; margin:1pt 0 0; }
.bookcover .badge{ margin:15pt auto 0; display:inline-flex; align-items:center; gap:7pt;
  border:1px solid rgba(122,160,255,.42); background:rgba(91,140,255,.11);
  border-radius:999px; padding:5pt 13pt; font-size:8.6pt; color:#cfdaf7; }
.bookcover .badge b{ color:#fff; }
.bookcover .byline{ margin-top:auto; padding-top:20pt; border-top:1px solid rgba(255,255,255,.13);
  display:flex; align-items:flex-end; justify-content:space-between; }
.bookcover .author-lbl{ font-family:var(--mono); font-size:7.6pt; letter-spacing:.2em;
  text-transform:uppercase; color:#7f8db8; }
.bookcover .author{ font-size:19.5pt; font-weight:700; letter-spacing:-0.015em; margin-top:3pt; }
.bookcover .pubname{ text-align:right; font-size:9.6pt; font-weight:700; color:#cfdaf7; letter-spacing:.02em; }
.bookcover .pubsub{ text-align:right; font-family:var(--mono); font-size:7.2pt;
  letter-spacing:.14em; text-transform:uppercase; color:#7f8db8; margin-top:2pt; }

/* ---------------- copyright page ---------------- */
.copyright{ display:flex; flex-direction:column; }
.copyright .cp-title{ font-size:15.5pt; line-height:1.22; font-weight:700; letter-spacing:-0.018em; margin:0; }
.copyright .cp-by{ font-size:10.6pt; color:var(--muted); margin:6pt 0 0; }
.copyright .cp-mark{ display:flex; align-items:center; gap:8pt; margin-bottom:26pt; }
.copyright .cp-mark .nm{ font-family:var(--mono); font-size:8.4pt; letter-spacing:.2em;
  text-transform:uppercase; color:var(--muted); }
.copyright dl{ margin:0; display:grid; grid-template-columns:1.32in 1fr; gap:3.5pt 0; font-size:9.2pt; }
.copyright dt{ color:var(--muted); font-family:var(--mono); font-size:8pt; letter-spacing:.05em;
  text-transform:uppercase; padding-top:1.4pt; }
.copyright dd{ margin:0; }
.copyright .legal{ font-size:8.5pt; line-height:1.52; color:#3f4658; }
.copyright .legal p{ margin:0 0 6pt; }
.copyright .legal h4{ font-size:8.2pt; text-transform:uppercase; letter-spacing:.09em;
  color:var(--muted); margin:11pt 0 2pt; }
.copyright .colophon{ margin-top:auto; padding-top:11pt; border-top:0.5pt solid var(--line);
  font-size:7.8pt; line-height:1.5; color:var(--faint); }
.rule{ height:3pt; width:1.5in; background:var(--accent); margin:18pt 0; border-radius:2pt; }

/* ---------------- contents ---------------- */
.toc{ list-style:none; padding:0; margin:0; }
.toc li{ display:flex; align-items:baseline; gap:6pt; padding:1.9pt 0; border-bottom:0.5pt dotted var(--line); }
.toc .num{ font-family:var(--mono); font-size:8.4pt; font-weight:700; color:var(--accent); width:26pt; flex:none; }
.toc .t{ flex:1; font-size:10pt; font-weight:600; }
.toc .d{ font-size:8.4pt; color:var(--muted); flex:2.1; }
.toc .pg{ font-family:var(--mono); font-size:8.6pt; color:var(--muted); font-weight:700; }

/* ---------------- code listing pages ---------------- */
/* Light ground, not the dark inline style: two dozen dark pages would be
   heavy in print and worse to read at this size. */
.listing-page .chnum{ margin-bottom:3pt; }
.lst-title{ font-size:15pt; letter-spacing:-0.015em; margin:0 0 4pt; }
.lst-blurb{ font-size:9.2pt; line-height:1.45; color:var(--muted); margin:0 0 5pt;
            max-width:64ch; }
.lst-meta{ font-family:var(--mono); font-size:7.4pt; color:var(--faint);
           letter-spacing:.06em; text-transform:uppercase; margin-bottom:3pt; }
.lst-part{ font-family:var(--mono); color:var(--faint); text-transform:none;
           letter-spacing:.04em; }
pre.listing{
  background:#fbfbfe; color:#1d2433;
  border:0.5pt solid var(--line); border-radius:4pt;
  padding:7pt 9pt; margin:0;
  font-family:var(--mono); font-size:7.4pt; line-height:1.42;
  white-space:pre; overflow:hidden;
}
pre.listing .ln{ color:#aab3cc; user-select:none; padding-right:9pt; }
pre.listing .c{ color:#7a8496; font-style:italic; }   /* comments */
pre.listing .s{ color:#0a6c4a; }                      /* strings */
pre.listing .x{ color:#9c5a08; }                      /* regex literals */

/* ---------------- part divider ---------------- */
.partnum{ font-family:var(--mono); font-size:8.4pt; font-weight:700;
          letter-spacing:.2em; text-transform:uppercase; color:var(--accent); }
.lab-card{ border:0.5pt solid var(--line); border-radius:6pt; padding:9pt 11pt;
           margin:0 0 8pt; background:var(--panel); }
.lab-card h3{ text-transform:none; letter-spacing:-0.01em; color:var(--ink);
              font-size:11pt; margin:0 0 1pt; }
.lab-card .lab-no{ font-family:var(--mono); font-size:7.6pt; font-weight:700;
                   color:var(--accent); letter-spacing:.12em; }
.lab-card .cmd{ font-family:var(--mono); font-size:8.4pt; background:var(--code-bg);
                color:var(--code-ink); padding:3pt 6pt; border-radius:3pt;
                display:inline-block; margin:3pt 0; }
.lab-card p{ font-size:8.8pt; line-height:1.48; margin:3pt 0 0; }
.lab-card .expect{ font-family:var(--mono); font-size:7.6pt; color:var(--good);
                   line-height:1.5; margin-top:3pt; }

/* ---------------- glossary ---------------- */
.gloss h4{ margin:6pt 0 0; font-size:9.3pt; }
.gloss h4:first-child{ margin-top:0; }
.gloss p{ margin:0 0 2pt; }

/* --- on-screen reading -------------------------------------------
   This guide is fixed-layout: @page has no margin and each .page block
   is exactly one Letter sheet, which supplies its own inner margins. In
   a browser those sheets stack flush against the left edge with nothing
   between them. Screen media centers them and sets them apart; print is
   untouched. */

@media screen {
  html { background: #e9ecf0; padding: 28px 16px; }
  body { background: transparent; }   /* the sheets are the pages, not the body */
  .page {
    margin: 0 auto 22px;
    background: #fff;
    border-radius: 3px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .10), 0 10px 30px rgba(0, 0, 0, .10);
  }
}

@media screen and (max-width: 900px) {
  html { padding: 0; background: #fff; }
  .page { width: 100%; height: auto; margin: 0 0 18px; border-radius: 0; box-shadow: none; }
}

/* ==========================================================================
   Additions for the CORS book: story passages, part plates, timelines.
   ========================================================================== */
.story{
  position:relative; margin:4pt 0 12pt; padding:11pt 14pt 10pt 16pt;
  background:#fbf8f2; border:0.5pt solid #eadfc9; border-radius:6pt;
  font-family:Charter,"Iowan Old Style",Georgia,serif; font-size:10.6pt; line-height:1.58; color:#2b2620;
}
.story::before{ content:""; position:absolute; left:0; top:10pt; bottom:10pt; width:3pt;
  border-radius:0 2pt 2pt 0; background:linear-gradient(180deg,#e0a84a,#c46a3c); }
.story .slug{ font-family:var(--mono); font-size:7.6pt; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:#a0632e; margin-bottom:4pt; }
.story p{ margin:0 0 6pt; } .story p:last-child{ margin-bottom:0; }
.story .said{ font-style:italic; }

/* full-page illustrated part openers */
.plate{ padding:0; color:#eef2ff; background:#0a0f1e; }
.plate .bg{ position:absolute; inset:0;
  background: radial-gradient(900px 600px at 70% 20%, rgba(91,140,255,.22), transparent 60%),
              radial-gradient(700px 520px at 15% 95%, rgba(74,211,166,.16), transparent 65%),
              linear-gradient(178deg,#0c1224 0%,#0a0f1e 55%,#06090f 100%); }
.plate .gridbg{ position:absolute; inset:0;
  background-image: linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:36px 36px; }
.plate .inner{ position:relative; height:100%; display:flex; flex-direction:column; padding:0.9in 0.85in 0.7in; }
.plate .pno{ font-family:var(--mono); font-size:9pt; font-weight:700; letter-spacing:.24em; text-transform:uppercase; color:#7ea6ff; }
.plate h1{ font-size:40pt; line-height:1.02; letter-spacing:-0.03em; margin:10pt 0 12pt; }
.plate .pl{ font-size:12.4pt; line-height:1.5; color:#b9c4e4; max-width:5.3in; }
.plate .art{ margin-top:auto; display:flex; justify-content:center; }
.plate .art svg{ width:6.3in; }
.plate .inthis{ margin-top:18pt; border-top:1px solid rgba(255,255,255,.14); padding-top:10pt;
  font-family:var(--mono); font-size:8pt; letter-spacing:.08em; color:#8f9cc4; line-height:1.9; }
.plate .inthis b{ color:#dce5ff; font-weight:700; }

/* timeline */
.tl{ position:relative; margin:8pt 0 4pt; padding-left:16pt; }
.tl::before{ content:""; position:absolute; left:4pt; top:3pt; bottom:3pt; width:1.2pt; background:var(--line-strong); }
.tl .ev{ position:relative; margin:0 0 7pt; font-size:9.2pt; line-height:1.45; }
.tl .ev::before{ content:""; position:absolute; left:-15.2pt; top:3.2pt; width:7pt; height:7pt; border-radius:50%;
  background:#fff; border:1.6pt solid var(--accent); }
.tl .yr{ font-family:var(--mono); font-weight:700; color:var(--accent); margin-right:5pt; }

.pull{ font-size:13pt; line-height:1.4; font-weight:600; letter-spacing:-0.01em; color:var(--ink);
  border-top:1pt solid var(--line-strong); border-bottom:1pt solid var(--line-strong); padding:8pt 0; margin:10pt 0; }
.kbd{ font-family:var(--mono); font-size:8.2pt; border:0.5pt solid var(--line-strong); border-bottom-width:1.4pt;
  border-radius:3pt; padding:0 3pt; background:#fff; }
.case{ border:0.5pt solid var(--line); border-radius:6pt; padding:9pt 11pt 8pt; margin:0 0 8pt; }
.case .meta{ font-family:var(--mono); font-size:7.4pt; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--warn); }
.case h3{ margin:2pt 0 3pt; font-size:11pt; }
.case p{ font-size:9.1pt; line-height:1.5; margin:0 0 4pt; }
.case .lesson{ font-size:8.9pt; background:var(--good-soft); border-radius:4pt; padding:4pt 7pt; margin-top:5pt; }
</style>
</head>
<body>
