<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool Specifications and Design for the Brokerage Domain</title>
<meta name="author" content="Smiroh Dev">
<style>
/* ==========================================================================
   Print-first stylesheet for a flowing book. Chrome's paged-media engine lays
   the text out on US Letter pages: @page supplies the margins and the running
   footer, each chapter is a named page (tools/build.py writes one rule per
   chapter so its footer carries its title), and the cover and part openers are
   full-bleed named pages.

   Nothing in the book is typeset by hand. Long code listings simply continue
   onto the next page; the contents' page numbers are found by rendering once,
   reading where each marker landed, and rendering again.
   ========================================================================== */
@page {
  size: Letter;
  margin: 0.74in 0.8in 0.78in;
  @bottom-left {
    content: "Tool Specifications and Design";
    font: 7.2pt "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: .06em;
    text-transform: uppercase; color: #8d95ab;
    border-top: 0.5pt solid #dbe1ef; vertical-align: top; padding-top: 6pt; margin-top: 14pt;
  }
  @bottom-center { content: ""; border-top: 0.5pt solid #dbe1ef; margin-top: 14pt; }
  @bottom-right {
    content: counter(page);
    font: bold 7.6pt Menlo, monospace; color: #59617a;
    border-top: 0.5pt solid #dbe1ef; vertical-align: top; padding-top: 5.4pt; margin-top: 14pt;
  }
}
@page cover {
  margin: 0;
  @bottom-left { content: none; border: none; } @bottom-center { content: none; border: none; }
  @bottom-right { content: none; border: none; }
}
@page plate {
  margin: 0;
  @bottom-left { content: none; border: none; } @bottom-center { content: none; border: none; }
  @bottom-right { content: none; border: none; }
}
@page front {
  @bottom-left { content: none; border: none; } @bottom-center { content: none; border: none; }
  @bottom-right { content: none; border: none; }
}
@page toc { @bottom-left { content: "Contents"; } }

:root{
  --ink:#14181f; --muted:#59617a; --faint:#8d95ab;
  --accent:#2f4fd0; --accent-soft:#eaeeff;
  --good:#0d7a52; --good-soft:#e6f6ee;
  --warn:#a8620a; --warn-soft:#fdf1e0;
  --bad:#c0203f;  --bad-soft:#fdeaee;
  --violet:#6b3fc4; --violet-soft:#f1ecfc;
  --panel:#f5f7fc; --panel-2:#eceff8; --line:#dbe1ef; --line-strong:#b9c2da;
  --t0:#0d7a52; --t1:#2f4fd0; --t2:#a8620a; --t3:#c0203f;
  --code-bg:#161b28; --code-ink:#e9edf7;
  --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:Charter,"Iowan Old Style",Georgia,serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}

*{ box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
html,body{ margin:0; padding:0; background:#fff; }
body{ font-family:var(--sans); color:var(--ink); font-size:10.2pt; line-height:1.56;
      orphans:3; widows:3; }

/* ---------------- chapters ---------------- */
.chapter{ position:relative; }
.pgmark{ position:absolute; top:0; left:0; font-size:1pt; color:#fff; }
.chnum{
  font-family:var(--mono); font-size:8.4pt; font-weight:700;
  color:var(--accent); letter-spacing:.16em; text-transform:uppercase; margin-bottom:5pt;
}
h1,h2,h3,h4{ margin:0; letter-spacing:-0.015em; break-after:avoid; }
h1.title{ font-size:24pt; line-height:1.12; margin-bottom:8pt; }
h2{ font-size:13.8pt; margin:18pt 0 5pt; }
h3{ font-size:10.8pt; margin:13pt 0 3pt; }
h4{ font-size:9.8pt; margin:9pt 0 2pt; }
p{ margin:0 0 7pt; }
.lede{ font-size:11.6pt; line-height:1.5; color:var(--muted); margin-bottom:12pt; }
.small{ font-size:9pt; } .tiny{ font-size:8.2pt; line-height:1.45; } .muted{ color:var(--muted); }
b,strong{ font-weight:700; }
code,.mono{ font-family:var(--mono); font-size:0.88em; }
p code,li code,td code,dd code,.icode{
  background:var(--panel-2); padding:0.4pt 2.6pt; border-radius:3px; color:#1d2433;
}
a{ color:var(--accent); text-decoration:none; }
ul,ol{ margin:0 0 7pt; padding-left:15pt; }
li{ margin-bottom:3pt; }
ul.tight li,ol.tight li{ margin-bottom:1pt; }

/* ---------------- blocks ---------------- */
.panel{ background:var(--panel); border:0.5pt solid var(--line); border-radius:6pt; padding:9pt 11pt;
        margin:8pt 0; break-inside:avoid; }
.callout{ border-left:2.5pt solid var(--accent); background:var(--accent-soft); padding:7pt 10pt;
          border-radius:0 5pt 5pt 0; margin:9pt 0; font-size:9.4pt; break-inside:avoid; }
.callout.good{ border-color:var(--good); background:var(--good-soft); }
.callout.warn{ border-color:var(--warn); background:var(--warn-soft); }
.callout.bad{ border-color:var(--bad); background:var(--bad-soft); }
.callout.ai{ border-color:var(--violet); background:var(--violet-soft); }
.callout .lbl{ font-weight:700; }
.callout p:last-child{ margin-bottom:0; }

.rule-box{ border:1pt solid var(--accent); border-radius:6pt; padding:8pt 11pt 6pt; margin:10pt 0;
           break-inside:avoid; background:#fff; }
.rule-box .rh{ font-family:var(--mono); font-size:7.6pt; font-weight:700; letter-spacing:.14em;
               text-transform:uppercase; color:var(--accent); margin-bottom:3pt; }
.rule-box ol, .rule-box ul{ margin-bottom:2pt; }
.rule-box li{ font-size:9.4pt; }

.grid{ display:grid; gap:10pt; }
.g2{ grid-template-columns:1fr 1fr; } .g3{ grid-template-columns:repeat(3,1fr); }

table{ width:100%; border-collapse:collapse; font-size:8.9pt; margin:8pt 0 10pt; break-inside:auto; }
th,td{ text-align:left; padding:4.4pt 6pt; border-bottom:0.5pt solid var(--line); vertical-align:top; }
th{ font-size:7.5pt; text-transform:uppercase; letter-spacing:.07em; color:var(--muted);
    border-bottom:1pt solid var(--line-strong); }
td.k, td.m{ font-family:var(--mono); font-size:8.2pt; }
td.k{ white-space:nowrap; }
tr{ break-inside:avoid; }
tr.hl td{ background:var(--accent-soft); }
table.dense th,table.dense td{ padding:2.8pt 6pt; }

.tag{ display:inline-block; font-size:7.2pt; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
      padding:0.6pt 5pt; border-radius:8pt; vertical-align:1pt; font-family:var(--sans); }
.tag.a{ background:var(--accent-soft); color:var(--accent); }
.tag.g{ background:var(--good-soft); color:var(--good); }
.tag.w{ background:var(--warn-soft); color:var(--warn); }
.tag.b{ background:var(--bad-soft); color:var(--bad); }
.tag.m{ background:var(--panel-2); color:var(--muted); }

.tier{ display:inline-block; font-family:var(--mono); font-size:7pt; font-weight:700;
  color:#fff; padding:0.8pt 3.6pt; border-radius:3pt; vertical-align:1pt; letter-spacing:.02em; }
.t0{ background:var(--t0); } .t1{ background:var(--t1); }
.t2{ background:var(--t2); } .t3{ background:var(--t3); }

/* The eight descriptor fields, drawn as a field map. */
.fieldmap{ display:grid; grid-template-columns:repeat(4,1fr); gap:6pt; margin:9pt 0 11pt; }
.fieldmap .f{ border:0.5pt solid var(--line-strong); border-radius:5pt; padding:6pt 7pt;
  break-inside:avoid; background:#fff; }
.fieldmap .f .n{ font-family:var(--mono); font-size:8.4pt; font-weight:700; color:#1d2433; }
.fieldmap .f .w{ font-size:7.4pt; text-transform:uppercase; letter-spacing:.07em;
  color:var(--muted); margin:1pt 0 3pt; }
.fieldmap .f p{ font-size:8pt; line-height:1.4; margin:0; color:#3f4658; }
.fieldmap .f.model{ border-color:var(--accent); background:var(--accent-soft); }
.fieldmap .f.model .w{ color:var(--accent); }

svg{ display:block; max-width:100%; }
figure{ margin:10pt 0 12pt; }
figure.fig{ break-inside:avoid; }
figure.fig svg{ margin:0 auto; }
figcaption{ font-size:8pt; color:var(--muted); margin-top:5pt; line-height:1.45; }
figcaption b{ color:var(--ink); }

/* ---------------- code ---------------- */
figure.code{
  border:0.5pt solid var(--line-strong); border-radius:5pt; background:#fbfbfe; margin:8pt 0 11pt;
  -webkit-box-decoration-break:clone; box-decoration-break:clone;
}
figure.code.keep{ break-inside:avoid; }
figure.code figcaption{
  display:flex; justify-content:space-between; gap:12pt; margin:0;
  font:7pt/1.3 var(--mono); color:var(--muted); letter-spacing:.02em;
  background:var(--panel-2); padding:3.4pt 8pt 3pt; border-bottom:0.5pt solid var(--line);
  border-radius:5pt 5pt 0 0; break-after:avoid;
}
figure.code figcaption .path{ font-weight:700; color:#3a4260; }
figure.code figcaption .note{ font-family:var(--sans); text-align:right; }
figure.code pre{
  margin:0; padding:6pt 8pt 7pt; font:7.2pt/1.47 var(--mono); color:#1d2433;
  white-space:pre-wrap; overflow-wrap:anywhere; tab-size:4;
}
pre .kw{ color:#6b3fc4; } pre .an{ color:#9c5a08; } pre .st{ color:#0a6c4a; }
pre .cm{ color:#7a8496; font-style:italic; } pre .nu{ color:#b4371f; } pre .key{ color:#2446b8; }
pre .tg{ color:#2446b8; } pre .at{ color:#9c5a08; } pre .pr{ color:#8d95ab; }

/* HTTP on the wire: dark, like a terminal, so it never looks like source code */
figure.code.http, figure.code.file.dark{ background:var(--code-bg); border-color:#2a3350; }
figure.code.http figcaption, figure.code.file.dark figcaption{ background:#222a3d; border-color:#2a3350; color:#8f9cc4; }
figure.code.http figcaption .path, figure.code.file.dark figcaption .path{ color:#c7d6ff; }
figure.code.http pre, figure.code.file.dark pre{ color:var(--code-ink); }
figure.code.http pre .rl{ color:#ffffff; font-weight:700; }
figure.code.http pre .ok{ color:#7fdba8; font-weight:700; }
figure.code.http pre .er{ color:#ff9fb0; font-weight:700; }
figure.code.http pre .hd{ color:#9db4ff; }
figure.code.http pre .key, figure.code.file.dark pre .key{ color:#9db4ff; }
figure.code.http pre .st, figure.code.file.dark pre .st{ color:#7fdba8; }
figure.code.http pre .nu, figure.code.file.dark pre .nu{ color:#ffcf70; }
figure.code.http pre .cm, figure.code.file.dark pre .cm{ color:#8b9bc4; }
figure.code.http pre .gap{ display:block; border-top:0.5pt dashed #3d4868; margin:5pt 0 4pt; }

/* ---------------- Appendix F: the complete source ---------------- */
.lst-module{ font-size:13pt; margin:16pt 0 3pt; }
.lst-module .mnum{ font-family:var(--mono); color:var(--accent); font-size:10.5pt; margin-right:4pt; }
.lst-blurb{ font-size:9pt; color:var(--muted); margin:0 0 6pt; }
.lst-file{ font-family:var(--mono); font-size:8.2pt; font-weight:700; color:#1d2433; letter-spacing:0;
           margin:11pt 0 3pt; padding:3pt 7pt; background:var(--panel-2); border-radius:4pt;
           display:flex; justify-content:space-between; position:relative; }
.lst-file .lines{ font-weight:400; color:var(--faint); }
pre.listing{
  margin:0 0 4pt; padding:0 0 0 2pt; font:6.9pt/1.42 var(--mono); color:#1d2433; white-space:pre;
}
/* A tool description is one JSON string and cannot be wrapped without changing what the model is
   shown, so data listings soft-wrap. Each line is its own block with a hanging indent, so a
   continuation sits under the code and not under the line number. */
pre.listing.wrap{ white-space:pre-wrap; overflow-wrap:anywhere; }
pre.listing.wrap .lrow{ display:block; padding-left:5.6ch; text-indent:-5.6ch; }
figure.code.wrap pre{ white-space:pre-wrap; overflow-wrap:anywhere; }
pre.listing .ln{ color:#b3bbd2; display:inline-block; width:4ch; text-align:right; margin-right:1.6ch; }
.lst-index{ break-after:page; }
.toc.files li{ padding:1.2pt 0; }
.toc.files .t{ font-family:var(--mono); font-size:7.8pt; font-weight:400; }
.toc.files li.grp{ font-weight:700; font-size:8.6pt; color:var(--accent); border-bottom:none; padding-top:6pt; }

/* ---------------- book cover ---------------- */
.bookcover{ page:cover; position:relative; width:8.5in; height:11in; overflow:hidden;
            color:#f2f5ff; background:#0a0f1e; break-after:page; }
.bookcover .bg{ position:absolute; inset:0;
  background:
    radial-gradient(1000px 640px at 50% 32%, rgba(255,186,84,.17), transparent 62%),
    radial-gradient(700px 520px at 88% 92%, rgba(91,140,255,.28), transparent 66%),
    linear-gradient(178deg,#0c1224 0%,#0a0f1e 48%,#06090f 100%); }
.bookcover .gridbg{ position:absolute; inset:0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.030) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.030) 1px, transparent 1px);
  background-size:36px 36px; }
.bookcover .spine{ position:absolute; left:0; top:0; bottom:0; width:16px;
  background:linear-gradient(180deg,#ffba54 0%,#5b8cff 55%,#a06bff 100%); }
.bookcover .hair{ position:absolute; left:16px; top:0; bottom:0; width:1px; background:rgba(255,255,255,.10); }
.bookcover .inner{ position:relative; height:100%; display:flex; flex-direction:column;
  padding:0.78in 0.72in 0.56in 0.9in; }
.bookcover .imprint{ display:flex; align-items:center; gap:9pt;
  font-family:var(--mono); font-size:8.2pt; letter-spacing:.2em; text-transform:uppercase; color:#8fa2d4; }
.bookcover .kicker{ margin-top:24pt; font-family:var(--mono); font-size:9.6pt; font-weight:700;
  letter-spacing:.17em; text-transform:uppercase; color:#ffcb7a; }
.bookcover h1.bt{ margin:9pt 0 0; font-size:50pt; line-height:0.98; letter-spacing:-0.032em; font-weight:700; }
.bookcover h1.bt .amp{ color:#9db4ff; font-weight:400; }
.bookcover .trule{ width:1.55in; height:3.5pt; border-radius:2pt; margin:17pt 0 14pt;
  background:linear-gradient(90deg,#ffba54,#5b8cff); }
.bookcover .sub{ font-size:12.4pt; line-height:1.42; color:#b9c4e4; max-width:5.2in; font-weight:400; margin:0; }
.bookcover .art{ margin:auto 0 0; padding:4pt 0 0; display:flex; justify-content:center; }
.bookcover .artcap{ text-align:center; font-family:var(--mono); font-size:7.4pt;
  letter-spacing:.13em; text-transform:uppercase; color:#7f8db8; margin:2pt 0 0; }
.bookcover .badge{ margin:13pt auto 0; display:inline-flex; align-items:center; gap:7pt;
  border:1px solid rgba(122,160,255,.42); background:rgba(91,140,255,.11);
  border-radius:999px; padding:5pt 13pt; font-size:8.6pt; color:#cfdaf7; }
.bookcover .badge b{ color:#fff; }
.bookcover .byline{ margin-top:auto; padding-top:18pt; border-top:1px solid rgba(255,255,255,.13);
  display:flex; align-items:flex-end; justify-content:space-between; }
.bookcover .author-lbl{ font-family:var(--mono); font-size:7.6pt; letter-spacing:.2em;
  text-transform:uppercase; color:#7f8db8; }
.bookcover .author{ font-size:19.5pt; font-weight:700; letter-spacing:-0.015em; margin-top:3pt; }
.bookcover .pubname{ text-align:right; font-size:9.6pt; font-weight:700; color:#cfdaf7; letter-spacing:.02em; }
.bookcover .pubsub{ text-align:right; font-family:var(--mono); font-size:7.2pt;
  letter-spacing:.14em; text-transform:uppercase; color:#7f8db8; margin-top:2pt; }

/* ---------------- copyright page ---------------- */
.copyright{ page:front; display:flex; flex-direction:column; min-height:9.3in; break-after:page; }
.copyright .cp-title{ font-size:15.5pt; line-height:1.22; font-weight:700; letter-spacing:-0.018em; margin:0; }
.copyright .cp-by{ font-size:10.6pt; color:var(--muted); margin:6pt 0 0; }
.copyright .cp-mark{ display:flex; align-items:center; gap:8pt; margin-bottom:24pt; }
.copyright .cp-mark .nm{ font-family:var(--mono); font-size:8.4pt; letter-spacing:.2em;
  text-transform:uppercase; color:var(--muted); }
.copyright dl{ margin:0; display:grid; grid-template-columns:1.32in 1fr; gap:3.5pt 0; font-size:9.2pt; }
.copyright dt{ color:var(--muted); font-family:var(--mono); font-size:8pt; letter-spacing:.05em;
  text-transform:uppercase; padding-top:1.4pt; }
.copyright dd{ margin:0; }
.copyright .legal{ font-size:8.4pt; line-height:1.5; color:#3f4658; }
.copyright .legal p{ margin:0 0 5.5pt; }
.copyright .legal h4{ font-size:8.1pt; text-transform:uppercase; letter-spacing:.09em;
  color:var(--muted); margin:10pt 0 2pt; }
.copyright .colophon{ margin-top:auto; padding-top:11pt; border-top:0.5pt solid var(--line);
  font-size:7.8pt; line-height:1.5; color:var(--faint); }

/* ---------------- contents ---------------- */
.contents{ page:toc; }
.contents h2.part{ font-size:10.6pt; margin:11pt 0 2pt; color:var(--ink); }
.contents h2.part .pn{ font-family:var(--mono); color:var(--accent); font-size:8.4pt; letter-spacing:.14em;
  text-transform:uppercase; margin-right:6pt; }
.toc{ list-style:none; padding:0; margin:0; }
.toc li{ margin:0; padding:1.9pt 0; border-bottom:0.5pt dotted var(--line); break-inside:avoid; }
.toc li a{ display:flex; align-items:baseline; gap:6pt; color:inherit; }
.toc .num{ font-family:var(--mono); font-size:8.2pt; font-weight:700; color:var(--accent); width:24pt; flex:none; }
.toc .t{ flex:1.25; font-size:9.7pt; font-weight:600; }
.toc .d{ font-size:8.2pt; color:var(--muted); flex:2; }
.toc .pg{ font-family:var(--mono); font-size:8.4pt; color:var(--muted); font-weight:700; min-width:18pt;
          text-align:right; }

/* ---------------- part openers ---------------- */
.plate{ page:plate; position:relative; width:8.5in; height:11in; overflow:hidden; color:#eef2ff;
        background:#0a0f1e; break-before:page; break-after:page; }
.plate .bg{ position:absolute; inset:0;
  background: radial-gradient(900px 600px at 70% 20%, rgba(91,140,255,.22), transparent 60%),
              radial-gradient(700px 520px at 15% 95%, rgba(255,186,84,.13), transparent 65%),
              linear-gradient(178deg,#0c1224 0%,#0a0f1e 55%,#06090f 100%); }
.plate .gridbg{ position:absolute; inset:0;
  background-image: linear-gradient(to right, rgba(255,255,255,.03) 1px, transparent 1px),
                    linear-gradient(to bottom, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size:36px 36px; }
.plate .inner{ position:relative; height:100%; display:flex; flex-direction:column; padding:0.9in 0.85in 0.7in; }
.plate .pno{ font-family:var(--mono); font-size:9pt; font-weight:700; letter-spacing:.24em;
             text-transform:uppercase; color:#ffcb7a; }
.plate h1{ font-size:40pt; line-height:1.02; letter-spacing:-0.03em; margin:10pt 0 12pt; }
.plate .pl{ font-size:12.2pt; line-height:1.5; color:#b9c4e4; max-width:5.4in; }
.plate .art{ margin-top:auto; display:flex; justify-content:center; }
.plate .art svg{ width:6.4in; }
.plate .inthis{ margin-top:18pt; border-top:1px solid rgba(255,255,255,.14); padding-top:10pt;
  font-family:var(--mono); font-size:8pt; letter-spacing:.06em; color:#8f9cc4; line-height:1.9; }
.plate .inthis b{ color:#dce5ff; font-weight:700; }

/* ---------------- story passages ---------------- */
.story{
  position:relative; margin:4pt 0 12pt; padding:11pt 14pt 10pt 16pt;
  background:#fbf8f2; border:0.5pt solid #eadfc9; border-radius:6pt;
  font-family:var(--serif); font-size:10.4pt; line-height:1.58; color:#2b2620; break-inside:avoid;
}
.story::before{ content:""; position:absolute; left:0; top:10pt; bottom:10pt; width:3pt;
  border-radius:0 2pt 2pt 0; background:linear-gradient(180deg,#e0a84a,#c46a3c); }
.story .slug{ font-family:var(--mono); font-size:7.6pt; font-weight:700; letter-spacing:.16em;
  text-transform:uppercase; color:#a0632e; margin-bottom:4pt; }
.story p{ margin:0 0 6pt; } .story p:last-child{ margin-bottom:0; }

.pull{ font-size:12.6pt; line-height:1.4; font-weight:600; letter-spacing:-0.01em; color:var(--ink);
  border-top:1pt solid var(--line-strong); border-bottom:1pt solid var(--line-strong); padding:8pt 0;
  margin:12pt 0; break-inside:avoid; }

/* numbered steps and definitions */
.steps{ counter-reset:step; list-style:none; padding-left:0; }
.steps > li{ counter-increment:step; position:relative; padding-left:22pt; margin-bottom:6pt; }
.steps > li::before{ content:counter(step); position:absolute; left:0; top:0.5pt; width:15pt; height:15pt;
  border-radius:50%; background:var(--accent); color:#fff; font:700 8pt/15pt var(--sans); text-align:center; }
dl.defs{ margin:6pt 0 9pt; }
dl.defs dt{ font-weight:700; font-size:9.6pt; margin-top:6pt; break-after:avoid; }
dl.defs dd{ margin:1pt 0 0 0; font-size:9.4pt; }
.gloss dt{ font-size:9.4pt; }
.gloss dd{ font-size:9pt; color:#2c3244; }

.checklist{ list-style:none; padding-left:0; }
.checklist li{ position:relative; padding-left:16pt; }
.onepage h3{ font-size:9.8pt; margin:7pt 0 2pt; }
.onepage li{ font-size:8.4pt; line-height:1.38; margin-bottom:0.6pt; }
.checklist li::before{ content:""; position:absolute; left:1pt; top:3pt; width:8pt; height:8pt;
  border:1pt solid var(--accent); border-radius:2pt; }

/* --- on-screen reading -------------------------------------------
   Everything above is a print stylesheet: @page supplies the margins and
   the body sits flush against them, which in a browser leaves the text
   running edge to edge. Screen media therefore gets its own measure: a
   Letter-wide column, centered, with the same side margins the printed
   page uses. None of this reaches the PDF, which Chrome renders through
   print media, so the two stay in step without a second stylesheet. */

@media screen {
  html {
    background: #e9ecf0;
    padding: 28px 16px;
