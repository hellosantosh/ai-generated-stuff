<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<title>Tool Specification Standard — Quick Reference</title>
<style>
/* ===================================================================
   Quick reference stylesheet. US Letter via headless Chrome.
   Denser than the standard's own stylesheet on purpose: this document
   is scanned, not read. Regenerate with tools/build-quickref.sh
   =================================================================== */

@page { size: letter; margin: 14mm 13mm 13mm 13mm; }

:root {
  --ink:       #16181d;
  --ink-soft:  #4a5058;
  --ink-faint: #767d87;
  --rule:      #d9dde3;
  --rule-soft: #eaedf1;
  --accent:    #1f4f8f;
  --accent-bg: #eef3fa;
  --green:     #1d6b45;
  --green-bg:  #e9f5ee;
  --amber:     #8a5a00;
  --amber-bg:  #fdf3e0;
  --red:       #a32a2a;
  --red-bg:    #fbeeee;
  --purple:    #5b3a8e;
  --purple-bg: #f2eefa;
  --code-bg:   #f6f7f9;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }
html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

body {
  font-family: var(--sans);
  font-size: 8.6pt;
  line-height: 1.45;
  color: var(--ink);
  margin: 0;
}

p { margin: 0 0 2.4mm; }
a { color: var(--accent); text-decoration: none; }
strong, b { font-weight: 650; }

/* --- masthead ---------------------------------------------------- */

.mast {
  background: linear-gradient(120deg, #101c30 0%, #1f4f8f 62%, #2f7cc4 100%);
  color: #fff;
  border-radius: 4px;
  padding: 7mm 8mm 6mm;
  margin-bottom: 5mm;
}
.mast .eyebrow {
  font-size: 7.6pt; letter-spacing: .2em; text-transform: uppercase;
  opacity: .74; margin-bottom: 3mm;
}
.mast h1 {
  font-size: 22pt; font-weight: 650; letter-spacing: -0.02em;
  margin: 0 0 2.5mm; border: 0; padding: 0; color: #fff;
  background: none; border-radius: 0;
  page-break-before: avoid; break-before: avoid;
}
.mast .sub { font-size: 10pt; opacity: .92; margin: 0 0 4mm; max-width: 150mm; }
.mast .meta {
  font-size: 7.8pt; opacity: .8; border-top: 1px solid rgba(255,255,255,.28); padding-top: 3mm;
}

/* --- headings ---------------------------------------------------- */

h1 {
  font-size: 13pt;
  font-weight: 650;
  letter-spacing: -0.01em;
  margin: 0 0 3.5mm;
  padding: 1.6mm 3mm;
  background: var(--accent);
  color: #fff;
  border-radius: 3px;
  page-break-after: avoid;
  break-after: avoid;
  margin-top: 7mm;
}
h1.newpage { page-break-before: always; break-before: page; }
h1 .n { opacity: .62; margin-right: 2.5mm; font-variant-numeric: tabular-nums; }

h2 {
  font-size: 9.6pt;
  font-weight: 650;
  margin: 5mm 0 2mm;
  padding-bottom: 1mm;
  border-bottom: 1.5px solid var(--accent);
  color: var(--accent);
  page-break-after: avoid;
  break-after: avoid;
}

h3 {
  font-size: 8.2pt; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
  color: var(--ink-soft); margin: 3.5mm 0 1.4mm;
  page-break-after: avoid; break-after: avoid;
}

/* --- tables ------------------------------------------------------ */

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 7.5pt;
  margin: 0 0 3.5mm;
  page-break-inside: avoid;
  break-inside: avoid;
}
table.long { page-break-inside: auto; break-inside: auto; }
th {
  text-align: left; font-weight: 700; font-size: 6.8pt;
  text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft);
  border-bottom: 1.2px solid var(--ink-soft);
  padding: 1.3mm 2mm 1mm 0; vertical-align: bottom;
}
td {
  border-bottom: 0.5px solid var(--rule-soft);
  padding: 1.2mm 2mm 1.2mm 0; vertical-align: top;
}
td:last-child, th:last-child { padding-right: 0; }
tbody tr:last-child td { border-bottom: 0.75px solid var(--rule); }
td code { font-size: 7.2pt; }
tr { page-break-inside: avoid; break-inside: avoid; }

table.ruleindex td:nth-child(1) { white-space: nowrap; width: 20mm; }
table.ruleindex td:nth-child(2) { width: 15mm; }
table.ruleindex td.sec { width: 11mm; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
table.ruleindex tr.grp td {
  background: var(--accent-bg); color: var(--accent);
  font-weight: 700; font-size: 7pt; letter-spacing: .08em; text-transform: uppercase;
  padding: 1.4mm 2mm; border-bottom: 0;
}

/* --- code -------------------------------------------------------- */

code {
  font-family: var(--mono); font-size: 0.9em;
  background: var(--code-bg); padding: 0.3mm 0.9mm;
  border-radius: 2px; border: 0.5px solid var(--rule-soft);
  white-space: nowrap;
}

pre {
  font-family: var(--mono);
  font-size: 7pt;
  line-height: 1.42;
  background: var(--code-bg);
  border: 0.75px solid var(--rule);
  border-left: 2.5px solid var(--accent);
  border-radius: 3px;
  /* Generous left padding: with a small one, Chrome lays the continuation of a
     soft-wrapped pre line at the border edge and long strings spill out. */
  padding: 2.4mm 3mm 2.4mm 6mm;
  margin: 0 0 3.5mm;
  white-space: pre-wrap;
  word-break: break-word;
  hyphens: none;
  -webkit-hyphens: none;
  page-break-inside: avoid;
  break-inside: avoid;
}
pre code { background: none; border: 0; padding: 0; font-size: inherit; white-space: inherit; }
pre.long { page-break-inside: auto; break-inside: auto; }
pre.good { border-left-color: var(--green); }
pre.bad  { border-left-color: var(--red); }

.c-key { color: var(--purple); }
.c-str { color: var(--green); }
.c-num { color: var(--red); }
.c-com { color: var(--ink-faint); font-style: italic; }

/* --- pills and levels -------------------------------------------- */

.lvl {
  font-size: 6.4pt; font-weight: 700; letter-spacing: .08em;
  padding: 0.3mm 1.1mm; border-radius: 2px; white-space: nowrap;
}
.lvl-must   { background: var(--red-bg);    color: var(--red); }
.lvl-should { background: var(--amber-bg);  color: var(--amber); }
.lvl-may    { background: var(--accent-bg); color: var(--accent); }
.lvl-never  { background: #2c2f36;          color: #fff; }

.risk {
  display: inline-block; font-size: 6.6pt; font-weight: 700; letter-spacing: .05em;
  padding: 0.4mm 1.3mm; border-radius: 2px; color: #fff; white-space: nowrap;
}
.r0 { background: #3f7a5a; } .r1 { background: #1f4f8f; }
.r2 { background: #8a5a00; } .r3 { background: #a32a2a; }

td .pill, td .risk { margin-bottom: 0.6mm; }
td.pills { line-height: 1.75; }
.pill {
  display: inline-block; font-size: 6.6pt; font-weight: 650; line-height: 1.3;
  padding: 0.4mm 1.3mm; border-radius: 2px; margin: 0 1mm 0.8mm 0;
  background: var(--accent-bg); color: var(--accent); white-space: nowrap;
}
.pill.ro { background: var(--green-bg); color: var(--green); }
.pill.no { background: var(--red-bg);   color: var(--red); }
.pill.sc { background: var(--purple-bg); color: var(--purple); font-family: var(--mono); }

/* --- cards and columns ------------------------------------------- */

.cols { display: flex; gap: 5mm; margin-bottom: 3.5mm; }
.cols > * { flex: 1; min-width: 0; }
.cols.avoid { page-break-inside: avoid; break-inside: avoid; }

.card {
  border: 0.75px solid var(--rule); border-radius: 3px;
  padding: 2.4mm 3mm; background: #fcfcfd;
  page-break-inside: avoid; break-inside: avoid;
  margin-bottom: 3.5mm;
}
.card h3 { margin-top: 0; }
.card p:last-child, .card ul:last-child { margin-bottom: 0; }

.yes, .no {
  border-left: 2.5px solid; border-radius: 0 3px 3px 0;
  padding: 2mm 2.6mm; margin: 0 0 3mm; font-size: 7.6pt;
  page-break-inside: avoid; break-inside: avoid;
}
.yes { border-color: var(--green); background: var(--green-bg); }
.no  { border-color: var(--red);   background: var(--red-bg); }
.yes .lbl, .no .lbl {
  font-size: 6.6pt; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  display: block; margin-bottom: 0.8mm;
}
.yes .lbl { color: var(--green); } .no .lbl { color: var(--red); }
.yes p:last-child, .no p:last-child { margin-bottom: 0; }

.key {
  border-left: 2.5px solid var(--amber); background: var(--amber-bg);
  border-radius: 0 3px 3px 0; padding: 2mm 2.6mm; margin: 0 0 3.5mm; font-size: 7.8pt;
  page-break-inside: avoid; break-inside: avoid;
}
.key .lbl {
  font-size: 6.6pt; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--amber); display: block; margin-bottom: 0.8mm;
}
.key p:last-child { margin-bottom: 0; }

/* --- lists ------------------------------------------------------- */

ul, ol { margin: 0 0 2.8mm; padding-left: 4.6mm; }
li { margin-bottom: 0.9mm; }

ul.tight { list-style: none; padding-left: 0; }
ul.tight li { padding-left: 3.6mm; position: relative; margin-bottom: 1mm; }
ul.tight li::before {
  content: "▸"; position: absolute; left: 0; color: var(--accent); font-size: 7pt;
}

ul.check { list-style: none; padding-left: 0; font-size: 7.6pt; }
ul.check li { padding-left: 5mm; position: relative; margin-bottom: 1.1mm; }
ul.check li::before {
  content: ""; position: absolute; left: 0; top: 0.5mm;
  width: 2.8mm; height: 2.8mm; border: 0.75px solid var(--ink-soft); border-radius: 1px;
}
ul.check li b { font-family: var(--mono); font-size: 7pt; color: var(--accent); font-weight: 700; }

.small { font-size: 7.2pt; color: var(--ink-soft); }
hr { border: 0; border-top: 0.5px solid var(--rule); margin: 4mm 0; }
.avoid { page-break-inside: avoid; break-inside: avoid; }

/* --- on-screen reading ------------------------------------------- 
   Everything above is a print stylesheet: @page supplies the margins and
   the body sits flush against them, which in a browser leaves the text
   running edge to edge. Screen media therefore gets its own measure — a
   Letter-wide column, centred, with the same side margins the printed
   page uses. None of this reaches the PDF, which Chrome renders through
   print media, so the two stay in step without a second stylesheet. */

@media screen {
  html {
    background: #e9ecf0;
    padding: 28px 16px;
  }
  body {
    max-width: 215.9mm;            /* one Letter page */
    margin: 0 auto;
    padding: 14mm 13mm 13mm;
    background: #fff;
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(22, 24, 29, .10), 0 10px 30px rgba(22, 24, 29, .10);
  }

  /* The card's section bands carry the structure once page breaks are gone. */
  h1.newpage { margin-top: 12mm; }
}

/* Below a page width, the page metaphor costs more than it gives. */
@media screen and (max-width: 900px) {
  html { padding: 0; background: #fff; }
  body { padding: 22px 18px; border-radius: 0; box-shadow: none; }
}
</style>
</head>
<body>
