openapi: 3.2.0

# The `$self` field is new in OpenAPI 3.2.0. It gives this document a stable,
# self-assigned identity that also acts as the base URI for reference resolution,
# independent of wherever the file happens to be retrieved from.
$self: https://api.brokerage.example.com/openapi/brokerage-api.yaml

info:
  title: Brokerage REST API
  summary: Accounts, positions, order status, transaction history, and stock and options trading.
  description: |
    A resource-oriented REST API for retail and advisor brokerage integrations.

    ## Design contract

    | Concern | Decision |
    | --- | --- |
    | Style | Resource-oriented REST over HTTPS, JSON representations |
    | Hypermedia | Every representation carries a `_links` map (see [HATEOAS](#section/HATEOAS)) |
    | Authorization | OAuth 2.1 authorization code grant with PKCE (S256), optionally DPoP-bound |
    | Errors | RFC 9457 `application/problem+json` |
    | Money | Decimal **strings** plus an ISO 4217 currency, never IEEE-754 floats |
    | Time | RFC 3339 timestamps, always UTC, always with an explicit offset |
    | Pagination | Opaque forward cursors, surfaced as a `next` link |
    | Safe retries | `Idempotency-Key` on every unsafe, non-idempotent operation |
    | Concurrency | Strong `ETag` plus mandatory `If-Match` on order mutation |

    ## HATEOAS

    Clients are expected to bookmark exactly one URL: the API root (`GET /`). Every
    other URL in this API is discovered by following a link relation. Concretely:

    * A representation's affordances live in `_links`, a map keyed by
      [IANA link relation](https://www.iana.org/assignments/link-relations/) or by a
      documented extension relation (`place-order`, `cancel`, `replace`, `positions`,
      `balances`, `transactions`, `executions`, `events`).
    * `_links` is **state-dependent**. A `FILLED` order has no `cancel` link. An
      account without options approval has no `place-option-order` link. Clients MUST
      branch on the presence of a link rather than on a status string, and MUST NOT
      construct URLs by string concatenation.
    * Each link carries `href` and, where the method is not `GET`, an explicit
      `method`. Templated links set `templated: true` and use RFC 6570 syntax.

    ## Versioning

    The major version is pinned in the server path (`/v1`). Additive changes —
    new fields, new enum members, new link relations — ship without a version bump,
    so clients MUST tolerate unknown properties and unknown enum values rather than
    failing closed.

    ## Out of scope

    This document covers stock and options trading only. Futures, crypto, event
    contracts, and the institutional application process are deliberately excluded.
  version: 1.0.0
  termsOfService: https://developer.brokerage.example.com/terms
  contact:
    name: Brokerage Developer Platform
    url: https://developer.brokerage.example.com/support
    email: api-support@brokerage.example.com
  license:
    name: Apache-2.0
    identifier: Apache-2.0

externalDocs:
  description: Developer portal, guides, and language examples
  url: https://developer.brokerage.example.com

servers:
  - url: https://api.brokerage.example.com/v1
    description: Production. Live orders against real money.
  - url: https://api.sandbox.brokerage.example.com/v1
    description: |
      Sandbox. Simulated fills against a delayed book, funded with paper money.
      Functionally identical surface; use it for conformance and CI.

# ---------------------------------------------------------------------------
# Tags. OpenAPI 3.2.0 adds `summary`, `parent`, and `kind` to the Tag Object,
# which lets an API description express its own navigation hierarchy instead of
# leaving that to renderer-specific extensions.
# ---------------------------------------------------------------------------
tags:
  - name: discovery
    summary: Discovery
    description: The single bookmarkable entry point for the API.
    kind: nav

  - name: accounts
    summary: Accounts
    description: |
      Read-only views of a customer's brokerage accounts: which accounts the
      access token can reach, what they hold, what they owe, and what they have done.
    kind: nav

  - name: account-list
    summary: Account list
    description: Enumerate the accounts covered by the current grant.
    parent: accounts
    kind: nav

  - name: balances
    summary: Balances
    description: Cash, buying power, margin, and net liquidation value.
    parent: accounts
    kind: nav

  - name: positions
    summary: Positions
    description: Current equity and option holdings with cost basis and unrealized P&L.
    parent: accounts
    kind: nav

  - name: order-status
    summary: Order status
    description: Read the working, filled, and terminal orders on an account.
    parent: accounts
    kind: nav

  - name: transactions
    summary: Transaction history
    description: Settled and pending cash and position activity.
    parent: accounts
    kind: nav

  - name: trading
    summary: Trading
    description: Operations that create, replace, or cancel orders. All require `orders:write`.
    kind: nav

  - name: stock-trading
    summary: Stock trading
    description: Single-leg equity orders, including short sales and extended-hours routing.
    parent: trading
    kind: nav

  - name: options-trading
    summary: Options trading
    description: Single-leg and multi-leg listed equity option orders.
    parent: trading
    kind: nav

  - name: instruments
    summary: Instruments
    description: |
      Symbol and contract resolution. Supporting surface — you need an
      `instrumentId` before you can place an order against a contract.
    kind: nav

  - name: streaming
    summary: Streaming
    description: Server-sent order and execution events.
    kind: nav

  - name: read-only
    summary: Read-only
    description: Operations reachable with read scopes alone.
    kind: audience

  - name: trade-enabled
    summary: Trade-enabled
    description: Operations that require an `orders:write` grant and a funded account.
    kind: audience

# ---------------------------------------------------------------------------
# Default security. Every operation requires an OAuth 2.1 access token; the
# per-operation `security` entries narrow this to the specific scopes needed.
# ---------------------------------------------------------------------------
security:
  - oauth2: [accounts:read]

paths:
  /:
    get:
      operationId: getApiRoot
      summary: API root
      description: |
        The hypermedia entry point. This is the only URL a client should hard-code;
        everything else is reached by following `_links`.
      tags: [discovery, read-only]
      security:
        - oauth2: []
      responses:
        "200":
          summary: Entry point returned
          description: The root document with links to every top-level collection.
          headers:
            RateLimit: { $ref: "#/components/headers/RateLimit" }
            RateLimit-Policy: { $ref: "#/components/headers/RateLimitPolicy" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiRoot" }
              examples:
                root:
                  summary: Root document
                  value:
                    apiVersion: "1.0.0"
                    _links:
                      self: { href: "https://api.brokerage.example.com/v1/" }
                      accounts: { href: "https://api.brokerage.example.com/v1/accounts" }
                      instruments:
                        href: "https://api.brokerage.example.com/v1/instruments{?query,type}"
                        templated: true
                      documentation: { href: "https://developer.brokerage.example.com" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        default: { $ref: "#/components/responses/Problem" }

  # =========================================================================
  # ACCOUNTS
  # =========================================================================
  /accounts:
    get:
      operationId: listAccounts
      summary: Account list
      description: |
        Returns every account the presented access token is authorized to see.

        The `accountId` returned here is an opaque, permanent identifier. It is
        **not** the account number the customer sees on statements — that value is
        returned separately as `accountNumber`, masked unless the token carries the
        `accounts:read:full` scope.

        The list is small and bounded (a customer rarely has more than a handful of
        accounts), so it is returned unpaginated.
      tags: [account-list, accounts, read-only]
      security:
        - oauth2: [accounts:read]
      responses:
        "200":
          summary: Accounts returned
          description: Zero or more accounts, newest first.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            RateLimit: { $ref: "#/components/headers/RateLimit" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountCollection" }
              examples:
                twoAccounts:
                  summary: An individual margin account and a Roth IRA
                  value:
                    items:
                      - accountId: "acct_01HQ8Z4M2X9K3P7R"
                        accountNumber: "••••4471"
                        nickname: "Main brokerage"
                        type: MARGIN
                        registration: INDIVIDUAL
                        status: ACTIVE
                        baseCurrency: USD
                        optionsLevel: LEVEL_3
                        dayTrader: true
                        openedAt: "2021-03-14T00:00:00Z"
                        _links:
                          self: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R" }
                          balances: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/balances" }
                          positions: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/positions" }
                          orders: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/orders" }
                          transactions: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/transactions" }
                          place-order:
                            href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/orders"
                            method: POST
                            title: "Place a stock or option order"
                      - accountId: "acct_01HQ8Z9T6B2V5N1D"
                        accountNumber: "••••8830"
                        nickname: "Roth IRA"
                        type: CASH
                        registration: ROTH_IRA
                        status: ACTIVE
                        baseCurrency: USD
                        optionsLevel: LEVEL_1
                        dayTrader: false
                        openedAt: "2019-11-02T00:00:00Z"
                        _links:
                          self: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z9T6B2V5N1D" }
                          balances: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z9T6B2V5N1D/balances" }
                          positions: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z9T6B2V5N1D/positions" }
                          orders: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z9T6B2V5N1D/orders" }
                          transactions: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z9T6B2V5N1D/transactions" }
                    _links:
                      self: { href: "https://api.brokerage.example.com/v1/accounts" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /accounts/{accountId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getAccount
      summary: Get one account
      description: Retrieve a single account by its opaque identifier.
      tags: [account-list, accounts, read-only]
      security:
        - oauth2: [accounts:read]
      responses:
        "200":
          summary: Account returned
          description: The account resource.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  /accounts/{accountId}/balances:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: getAccountBalances
      summary: Account balances
      description: |
        Cash, buying power, margin, and net liquidation value for one account.

        Balances are a **snapshot**, stamped with `asOf`. Intraday they reflect
        real-time marks on open positions and unsettled trade activity; after the
        close they settle to end-of-day values. Do not cache beyond `Cache-Control`.

        `buyingPower` is broken out by what it can be spent on, because the numbers
        genuinely differ: a margin account's stock buying power is typically twice
        its option buying power, and day-trading buying power is a separate,
        larger number that resets each session.
      tags: [balances, accounts, read-only]
      security:
        - oauth2: [accounts:read]
      responses:
        "200":
          summary: Balances returned
          description: A balance snapshot in the account's base currency.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control:
              description: Always `no-store` during market hours.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Balances" }
              examples:
                marginAccount:
                  summary: Funded margin account, intraday
                  value:
                    accountId: "acct_01HQ8Z4M2X9K3P7R"
                    currency: USD
                    asOf: "2026-08-17T18:42:11Z"
                    netLiquidation: "184320.55"
                    equity: "184320.55"
                    cash:
                      total: "42180.10"
                      settled: "39900.00"
                      unsettled: "2280.10"
                      withdrawable: "39900.00"
                    buyingPower:
                      stock: "84360.20"
                      option: "39900.00"
                      dayTrading: "168720.40"
                    margin:
                      maintenanceRequirement: "38504.00"
                      initialRequirement: "71140.22"
                      marginBalance: "0.00"
                      excessLiquidity: "145816.55"
                      marginCall: null
                    positionsMarketValue: "142140.45"
                    dayTradesUsed: 1
                    dayTradesRemaining: 3
                    patternDayTrader: true
                    _links:
                      self: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/balances" }
                      account: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R" }
                      positions: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/positions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  /accounts/{accountId}/positions:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: listPositions
      summary: Account positions
      description: |
        Open positions on the account, one row per instrument and side.

        Long and short exposure in the same underlying are returned as separate
        positions. Option positions carry the full contract descriptor and are
        quantified in **contracts**, not shares; `contractMultiplier` (normally 100)
        tells you how to convert.

        Closed positions are not returned here — use the transaction history for
        realized activity.
      tags: [positions, accounts, read-only]
      security:
        - oauth2: [positions:read]
      parameters:
        - name: instrumentType
          in: query
          description: Restrict to one instrument class.
          required: false
          schema:
            type: string
            enum: [EQUITY, ETF, OPTION]
        - name: symbol
          in: query
          description: Restrict to one underlying symbol. Matches option positions on that underlying too.
          required: false
          schema: { type: string, examples: ["AAPL"] }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          summary: Positions returned
          description: A page of open positions.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionCollection" }
              examples:
                mixed:
                  summary: A long stock position and a short call against it
                  value:
                    items:
                      - positionId: "pos_01HQ9A1F4C8M2Q6T"
                        accountId: "acct_01HQ8Z4M2X9K3P7R"
                        instrument:
                          instrumentId: "inst_eq_AAPL"
                          type: EQUITY
                          symbol: "AAPL"
                          name: "Apple Inc."
                          currency: USD
                        side: LONG
                        quantity: "500"
                        contractMultiplier: 1
                        averageCost: "178.4200"
                        costBasis: "89210.00"
                        lastPrice: "231.1500"
                        marketValue: "115575.00"
                        unrealizedPnl: "26365.00"
                        unrealizedPnlPercent: "29.5539"
                        realizedPnlYtd: "1840.22"
                        openedAt: "2024-06-11T13:41:07Z"
                        _links:
                          self: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/positions/pos_01HQ9A1F4C8M2Q6T" }
                          instrument: { href: "https://api.brokerage.example.com/v1/instruments/inst_eq_AAPL" }
                          close-position:
                            href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/orders"
                            method: POST
                            title: "Sell 500 AAPL to flatten"
                      - positionId: "pos_01HQ9A3H7D1N4S8V"
                        accountId: "acct_01HQ8Z4M2X9K3P7R"
                        instrument:
                          instrumentId: "inst_op_AAPL_20261218C00250000"
                          type: OPTION
                          symbol: "AAPL  261218C00250000"
                          name: "AAPL Dec 18 2026 250 Call"
                          currency: USD
                          option:
                            underlyingSymbol: "AAPL"
                            underlyingInstrumentId: "inst_eq_AAPL"
                            occSymbol: "AAPL  261218C00250000"
                            expiration: "2026-12-18"
                            strike: "250.00"
                            optionType: CALL
                            exerciseStyle: AMERICAN
                            contractMultiplier: 100
                        side: SHORT
                        quantity: "-5"
                        contractMultiplier: 100
                        averageCost: "12.4000"
                        costBasis: "-6200.00"
                        lastPrice: "9.8500"
                        marketValue: "-4925.00"
                        unrealizedPnl: "1275.00"
                        unrealizedPnlPercent: "20.5645"
                        realizedPnlYtd: "0.00"
                        openedAt: "2026-07-02T14:05:52Z"
                        _links:
                          self: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/positions/pos_01HQ9A3H7D1N4S8V" }
                          instrument: { href: "https://api.brokerage.example.com/v1/instruments/inst_op_AAPL_20261218C00250000" }
                    _links:
                      self: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/positions?limit=50" }
                      account: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  /accounts/{accountId}/positions/{positionId}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - name: positionId
        in: path
        required: true
        description: Opaque position identifier.
        schema: { type: string, examples: ["pos_01HQ9A1F4C8M2Q6T"] }
    get:
      operationId: getPosition
      summary: Get one position
      tags: [positions, accounts, read-only]
      security:
        - oauth2: [positions:read]
      responses:
        "200":
          summary: Position returned
          description: A single open position.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Problem" }

  /accounts/{accountId}/transactions:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      operationId: listTransactions
      summary: Transaction history
      description: |
        Cash and position activity on the account: trades, dividends, interest,
        fees, transfers, assignments, exercises, expirations, and corporate actions.

        Results are ordered by `tradeDate` descending, then by `transactionId`
        descending as a stable tiebreaker. Because settlement can back-date an entry,
        a transaction may appear in a page you have already read; reconcile on
        `transactionId`, which is permanent and unique.

        The window defaults to the last 90 days. `from`/`to` accept any range up to
        7 years; ranges wider than 1 year are served from cold storage and may take
        several seconds.
      tags: [transactions, accounts, read-only]
      security:
        - oauth2: [transactions:read]
      parameters:
        - name: from
          in: query
          description: Inclusive lower bound on trade date. Defaults to 90 days ago.
          required: false
          schema: { type: string, format: date, examples: ["2026-01-01"] }
        - name: to
          in: query
          description: Inclusive upper bound on trade date. Defaults to today.
          required: false
          schema: { type: string, format: date, examples: ["2026-08-17"] }
        - name: type
          in: query
          description: Restrict to one or more transaction types. Repeat the parameter to OR them.
          required: false
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/TransactionType" }
        - name: symbol
          in: query
          description: Restrict to activity in one symbol or its options.
          required: false
          schema: { type: string }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          summary: Transactions returned
          description: A page of transactions, most recent first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionCollection" }
              examples:
                page:
                  summary: A fill, a dividend, and a fee
                  value:
                    items:
                      - transactionId: "txn_01HQ9C2K5M8P1R4W"
                        accountId: "acct_01HQ8Z4M2X9K3P7R"
                        type: TRADE
                        subType: BUY
                        description: "Bought 100 AAPL @ 231.05"
                        tradeDate: "2026-08-15"
                        settlementDate: "2026-08-18"
                        instrument:
                          instrumentId: "inst_eq_AAPL"
                          type: EQUITY
                          symbol: "AAPL"
                          name: "Apple Inc."
                          currency: USD
                        quantity: "100"
                        price: "231.0500"
                        grossAmount: "-23105.00"
                        fees:
                          - type: REGULATORY
                            description: "SEC Section 31 fee"
                            amount: "0.00"
                        netAmount: "-23105.00"
                        currency: USD
                        relatedOrderId: "ord_01HQ9C1J3L7N0Q3V"
                        _links:
                          self: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/transactions/txn_01HQ9C2K5M8P1R4W" }
                          order: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/orders/ord_01HQ9C1J3L7N0Q3V" }
                      - transactionId: "txn_01HQ9B8G4J2L6N9S"
                        accountId: "acct_01HQ8Z4M2X9K3P7R"
                        type: DIVIDEND
                        subType: CASH_DIVIDEND
                        description: "AAPL cash dividend 0.26/share on 500 shares"
                        tradeDate: "2026-08-14"
                        settlementDate: "2026-08-14"
                        instrument:
                          instrumentId: "inst_eq_AAPL"
                          type: EQUITY
                          symbol: "AAPL"
                          name: "Apple Inc."
                          currency: USD
                        quantity: "500"
                        grossAmount: "130.00"
                        fees: []
                        netAmount: "130.00"
                        currency: USD
                        _links:
                          self: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/transactions/txn_01HQ9B8G4J2L6N9S" }
                      - transactionId: "txn_01HQ9B1D9F3H5K7M"
                        accountId: "acct_01HQ8Z4M2X9K3P7R"
                        type: FEE
                        subType: MARGIN_INTEREST
                        description: "Margin interest, Jul 2026"
                        tradeDate: "2026-08-01"
                        settlementDate: "2026-08-01"
                        grossAmount: "-18.44"
                        fees: []
                        netAmount: "-18.44"
                        currency: USD
                        _links:
                          self: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/transactions/txn_01HQ9B1D9F3H5K7M" }
                    _links:
                      self: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/transactions?from=2026-08-01&limit=3" }
                      next: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R/transactions?from=2026-08-01&limit=3&cursor=eyJvIjoxMjAwfQ" }
                      account: { href: "https://api.brokerage.example.com/v1/accounts/acct_01HQ8Z4M2X9K3P7R" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
